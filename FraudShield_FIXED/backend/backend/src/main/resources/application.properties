spring.application.name=backend

# Local demo default: embedded H2 in PostgreSQL compatibility mode.
# Use --spring.profiles.active=postgres with DB_URL/DB_USERNAME/DB_PASSWORD for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:fraudshield;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${SERVER_PORT:8087}

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral

# FraudShield trained ML service
# hybrid = ML fraud probability + behavioral signal sub-scores drive the final fraud risk/decision
# shadow = call/store ML but leave fallback rule decision unchanged
# off    = do not call ML
fraud.ml.url=${ML_URL:http://127.0.0.1:8001}
fraud.ml.token=${ML_SCORE_TOKEN:fraudshield-demo-score-token-2026-local}
fraud.ml.identity-secret=${ML_IDENTITY_SECRET:fraudshield-demo-identity-secret-2026-local}
fraud.ml.mode=${ML_MODE:hybrid}

# ─── Fraud Risk Scoring Weights ─────────────────────────────────────────────
# The HistGradientBoosting ML model (calibrated with CalibratedClassifierCV/sigmoid)
# is the PRIMARY driver of the fraud decision (weight = 0.55).
# The IsolationForest anomaly detector surfaces novel fraud patterns.
# Behavioral/identity sub-scores are supporting signals only (total weight = 0.45).
# All weights must sum to 1.0.
#
# finalFraudRiskScore =
#   (fraud.weight.ml        * mlFraudProbability * 100)
# + (fraud.weight.identity  * identityRiskScore)
# + (fraud.weight.device    * deviceRiskScore)
# + (fraud.weight.velocity  * velocityRiskScore)
# + (fraud.weight.location  * locationRiskScore)
#
# Credit score, loan amount, income, employment type and age are NOT included —
# these are credit-worthiness signals evaluated separately by the lending team.
fraud.weight.ml=${FRAUD_WEIGHT_ML:0.55}
fraud.weight.identity=${FRAUD_WEIGHT_IDENTITY:0.15}
fraud.weight.device=${FRAUD_WEIGHT_DEVICE:0.10}
fraud.weight.velocity=${FRAUD_WEIGHT_VELOCITY:0.10}
fraud.weight.location=${FRAUD_WEIGHT_LOCATION:0.10}

# Fraud decision thresholds (applied to finalFraudRiskScore out of 100).
# A single suspicious signal must NOT automatically produce HIGH_RISK.
# review-max raised to 65 to reduce false positives from isolated low-weight signals.
fraud.decision.low-max=${FRAUD_LOW_MAX:30}
fraud.decision.review-max=${FRAUD_REVIEW_MAX:65}

fraud.admin.email=${ADMIN_EMAIL:admin@fraudshield.local}
fraud.admin.password=${ADMIN_PASSWORD:admin123}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
