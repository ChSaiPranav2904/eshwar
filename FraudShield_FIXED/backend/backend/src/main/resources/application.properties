spring.application.name=backend

# Default to an embedded database so the app can start locally without a manually created PostgreSQL database.
# For a real Postgres instance, set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, and DB_DIALECT in the environment.
spring.datasource.url=${DB_URL:jdbc:h2:mem:fraudshield;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8087

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral

# FraudShield trained ML service
# hybrid = rule score + trained ML probability influence the final risk/decision
# shadow = call/store ML but leave legacy rule decision unchanged
# off    = do not call ML
fraud.ml.url=${ML_URL:http://127.0.0.1:8001}
fraud.ml.token=${ML_SCORE_TOKEN:fraudshield-demo-score-token-2026-local}
fraud.ml.identity-secret=${ML_IDENTITY_SECRET:fraudshield-demo-identity-secret-2026-local}
fraud.ml.mode=${ML_MODE:hybrid}
