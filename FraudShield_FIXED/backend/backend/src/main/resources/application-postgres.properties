# PostgreSQL profile. Start with:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# or set SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fraudshields}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
